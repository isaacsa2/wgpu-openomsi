name: cargo-generate

on:
  # Feature branches are validated by pull_request. Avoid duplicate push runs
  # and CI floods when upstream release branches are mirrored into this fork.
  push:
    branches: [trunk, main, openomsi/v29]
  pull_request:
  merge_group:

env:
  #
  # Dependency versioning
  #

  # This is the MSRV used by `wgpu` itself.
  WGPU_MSRV: "1.87"
  # Standalone templates have no pinned Cargo.lock; prefer dependencies
  # compatible with their declared Rust 1.87 minimum supported version.
  CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
  RUSTFLAGS: -D warnings

# Every time a PR is pushed to, cancel any previous jobs. This
# makes us behave nicer to github and get faster turnaround times
# on PRs that are pushed to multiple times in rapid succession.
concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: ${{github.event_name == 'pull_request'}}

jobs:
  cargo-generate:
    timeout-minutes: 5

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "01-hello-compute"
            path: "examples/standalone/01_hello_compute"
          - name: "02-hello-window"
            path: "examples/standalone/02_hello_window"
          - name: "custom_backend"
            path: "examples/standalone/custom_backend"

    name: "${{ matrix.name }}"

    steps:
      - uses: actions/checkout@v6

      # We can't rely on an override here, as that would only set
      # the toolchain for the current directory, not the newly generated project.
      - name: Install repo MSRV toolchain
        run: |
          rustup toolchain install ${{ env.WGPU_MSRV }} --no-self-update --profile=minimal
          cargo -V

      - name: Disable debug symbols
        shell: bash
        run: |
          mkdir -p .cargo

          cat <<EOF >> .cargo/config.toml
            [profile.dev]
            debug = false
          EOF

      - name: Caching
        uses: Swatinem/rust-cache@v2
        with:
          key: cargo-generate-${{ matrix.name }}

      - name: Install `cargo-generate`
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-generate

      - name: Run `cargo-generate`
        run: |
          cd ..
          # This fork checks out as wgpu-openomsi, but standalone templates and
          # their [patch.crates-io] entries use the upstream folder name 'wgpu'.
          # The symlink works for both the generator and the example patch path.
          if [ ! -e wgpu ]; then ln -s "$GITHUB_WORKSPACE" wgpu; fi
          cargo generate --path "wgpu/${{ matrix.path }}" --name "${{ matrix.name }}"

      - name: Check generated files
        run: |
          cd ../${{ matrix.name }}/
          cat <<EOF >> Cargo.toml
            [patch.crates-io]
            wgpu = { path = "../wgpu/wgpu" }
          EOF
          cargo +${{ env.WGPU_MSRV }} check
