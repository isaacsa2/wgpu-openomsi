name: Cancel redundant mirror runs

on:
  push:
    branches:
      - maintenance/cancel-mirror-workflows

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    if: github.repository == 'isaacsa2/wgpu-openomsi'
    runs-on: ubuntu-latest
    steps:
      - name: Cancel duplicate and mirror-triggered jobs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          THIS_RUN: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          base = f"https://api.github.com/repos/{os.environ['GH_REPOSITORY']}"
          token = os.environ["GH_TOKEN"]
          this_run = int(os.environ["THIS_RUN"])
          since = "2026-10-13T03:45:00Z"
          active = {"queued", "in_progress", "pending", "waiting", "requested", "action_required"}

          def request(method, path):
              req = Request(
                  base + path,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urlopen(req, timeout=30) as res:
                  return json.load(res) if res.status == 200 else None

          latest_pr_sha = request("GET", "/pulls/1")["head"]["sha"]
          runs = []
          page = 1
          while True:
              data = request("GET", f"/actions/runs?per_page=100&page={page}")
              group = data.get("workflow_runs", [])
              runs.extend(group)
              if len(group) < 100:
                  break
              page += 1

          cancelled = 0
          failed = 0
          preserved = 0
          for run in runs:
              if run["id"] == this_run or run["status"] not in active:
                  continue
              if run["created_at"] < since:
                  continue
              if (run["head_sha"] == latest_pr_sha
                  and run["event"] == "pull_request"
                  and run["name"] == "CI"):
                  preserved += 1
                  continue
              try:
                  request("POST", f"/actions/runs/{run['id']}/cancel")
                  cancelled += 1
                  print(f"Cancel requested: {run['id']} {run['name']} [{run['status']}]")
              except HTTPError as exc:
                  failed += 1
                  print(f"Could not cancel {run['id']}: HTTP {exc.code}")
              time.sleep(0.05)
          print(f"Cancellation requests: {cancelled}; failures: {failed}; latest PR CI preserved: {preserved}")
          PY
